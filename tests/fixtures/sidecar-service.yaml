replicaCount: 1
fullnameOverride: web

image:
  repository: 961544628309.dkr.ecr.us-east-1.amazonaws.com/sumstore/web
  tag: c439cc37b84709c8e2b21dc50ae804cf349a53c9
  pullPolicy: IfNotPresent

containerPort:
  enabled: true
  port: 8080

service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  CATALOGUE_HOST: catalogue

probes:
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

extraContainers:
  - name: nginx-exporter
    image: nginx/nginx-prometheus-exporter:1.4.1
    imagePullPolicy: IfNotPresent
    ports:
      - name: metrics
        containerPort: 9113
        protocol: TCP
    args:
      - -nginx.scrape-uri=http://127.0.0.1:8080/nginx_status
    env:
      - name: SCRAPE_TIMEOUT
        value: "5s"
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
