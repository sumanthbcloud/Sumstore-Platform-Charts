# Default values for microservice chart.
# This is a platform contract for SUM Store microservices.

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}

containerPort:
  enabled: true
  port: 8080

service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080

config: {}

existingSecret: ""

probes:
  startup:
    enabled: false
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 30
    successThreshold: 1
  readiness:
    enabled: false
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  liveness:
    enabled: false
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

resources: {}
