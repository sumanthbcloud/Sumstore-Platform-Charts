# Default values for microservice chart.
# This is a platform contract for SUM Store microservices.

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}

containerPort:
  enabled: true
  port: 8080

service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080

config: {}

existingSecret: ""

probes:
  startup:
    enabled: false
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 30
    successThreshold: 1
  readiness:
    enabled: false
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  liveness:
    enabled: false
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

resources: {}

# Optional sidecar containers to run alongside the primary container.
# Example:
# extraContainers:
#   - name: nginx-exporter
#     image: nginx/nginx-prometheus-exporter:1.4.1
#     imagePullPolicy: IfNotPresent
#     ports:
#       - name: metrics
#         containerPort: 9113
#         protocol: TCP
#     args:
#       - -nginx.scrape-uri=http://127.0.0.1:8080/nginx_status
#     resources:
#       requests:
#         cpu: 10m
#         memory: 16Mi
#       limits:
#         cpu: 50m
#         memory: 32Mi
extraContainers: []
